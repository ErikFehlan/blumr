name: Verify active beta production runtime
on:
  workflow_call:
  push:
    branches: [ops/open-beta-release-verification-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed source, active AI, closed billing and isolation without writes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: zqiqjzxcpznhzjengfff
        run: node scripts/open-beta-production-verify.mjs
