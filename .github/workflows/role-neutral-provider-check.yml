name: Diagnose role-neutral release provider access
on:
  push:
    branches: [maintenance/role-neutral-provider-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean exact abandoned fixtures and check provider access with synthetic notes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/role-neutral-provider-check.mjs
