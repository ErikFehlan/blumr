name: Capture fictional campaign demo
on:
  push:
    branches: [kickstarter-readiness-followup]
    paths:
      - scripts/record-campaign-demo.cjs
      - .github/workflows/campaign-demo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture fictional workflow with no provider calls
        run: node scripts/record-campaign-demo.cjs test-results/campaign-demo
      - name: Save recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blumr-fictional-ui-demo
          path: test-results/campaign-demo/
          retention-days: 7
          if-no-files-found: warn
