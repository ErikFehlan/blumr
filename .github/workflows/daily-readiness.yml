name: Verify daily staging assessment readiness
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    # Daily paid evaluations require an explicit cost decision. The separate
    # operations monitor continues its read-only production health checks.
    if: github.event_name == 'workflow_dispatch' || vars.RUN_SCHEDULED_PAID_AI_TESTS == 'true'
    uses: ./.github/workflows/staging-backend.yml
    secrets: inherit
