name: Verify and retain independent encrypted backup
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [reliability/backups-and-release-gates, hardening/production-readiness, main]
    paths: ['scripts/*backup*', '.github/workflows/independent-backup.yml']
permissions:
  contents: read
concurrency:
  group: independent-encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    if: >-
      github.event_name != 'pull_request' ||
      (github.repository == 'ErikFehlan/blumr' && github.event.pull_request.number == 147 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feat/subscription-foundation' && github.event.label.name == 'verify-production-backup')
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zqiqjzxcpznhzjengfff
      SUPABASE_TELEMETRY_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      # Password-free production session route verified in Supabase Connect.
      BACKUP_POOLER_URL: postgresql://postgres.zqiqjzxcpznhzjengfff@aws-0-us-east-2.pooler.supabase.com:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Dump database, copy every Storage object, encrypt, and prove isolated recovery
        run: |
          for attempt in 1 2 3; do
            if node scripts/independent-backup.mjs; then exit 0; else status=$?; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            echo "Source changed during attempt $attempt; no archive was accepted. Retrying a fresh snapshot."
          done
          exit 1
      - name: Retain only verified encrypted archives and aggregate recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/independent-backup/
          retention-days: 90
          if-no-files-found: error
