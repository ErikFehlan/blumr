name: Prepare disabled billing staging configuration
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/billing-staging-setup.mjs'
      - 'tests/billing-staging-setup.test.mjs'
      - '.github/workflows/billing-staging-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: billing-staging-setup
  cancel-in-progress: false
jobs:
  configure:
    if: >-
      github.repository == 'ErikFehlan/blumr' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.number == 147 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'feat/subscription-foundation') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/subscription-foundation'))
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify staging boundaries with simulated management requests
        run: node --test tests/billing-staging-setup.test.mjs
      - name: Transfer existing staging credentials and keep billing disabled
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: momfzjmycveqginxmqib
          STRIPE_BILLING_SANDBOX_KEY: ${{ secrets.STRIPE_BILLING_SANDBOX_KEY }}
        run: node scripts/billing-staging-setup.mjs
