name: Job intake rollout mode
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Job intake engine
        required: true
        default: legacy_ai
        type: choice
        options:
          - hybrid
          - legacy_ai
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-latest
    environment: criteria-backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set intake mode
        run: supabase secrets set JOB_INTAKE_ENGINE="${{ inputs.mode }}" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify live mode
        env:
          JOB_INTAKE_EXPECTED_MODE: ${{ inputs.mode }}
        run: node scripts/criteria-backend.mjs verify
