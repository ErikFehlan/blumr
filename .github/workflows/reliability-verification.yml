name: Verify reliability recovery and concurrent use
on:
  push:
    branches: [reliability/verification-8-through-12]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-verification
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    environment: criteria-backend
    timeout-minutes: 10
    env:
      LIVE_FIXTURE_FILE: /tmp/blumr-recovery-${{ github.run_id }}-${{ github.run_attempt }}.json
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create disposable fixture accounts
        id: fixtures
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/live-site-fixtures.mjs create
      - name: Delete and restore synthetic records and resume bytes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/reliability-recovery-drill.mjs
      - name: Verify fixture cleanup
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/live-site-fixtures.mjs cleanup
      - name: Save synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-recovery
          path: test-results/recovery/
          retention-days: 7
          if-no-files-found: ignore
  concurrent-use:
    uses: ./.github/workflows/production-load-canary.yml
    secrets: inherit
