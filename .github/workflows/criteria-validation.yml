name: Validate criteria automation backend
on:
  pull_request:
    branches: [main]
  push:
    branches: [hardening/reliability, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check worker types
        run: deno check supabase/functions/account-controls/index.ts supabase/functions/refine-job-criteria/index.ts supabase/functions/analyze-patterns-beta/index.ts supabase/functions/reassess-job/index.ts supabase/functions/sol-model-check/index.ts
      - name: Test code-first job intake
        run: |
          deno test --allow-env tests/hiring-priorities-worker.test.ts
          node --check scripts/criteria-backend.mjs
          node --test tests/code-first-job-intake.test.js tests/code-first-job-intake-corpus.test.js tests/criteria-automation.test.js tests/hiring-priorities.test.js
      - name: Test focused feedback and authentication
        run: deno test --allow-env tests/provider-retry.test.ts tests/sol-routing.test.ts tests/security-backend.test.ts tests/learning-routing.test.ts tests/account-controls.test.ts tests/analysis-latency.test.ts tests/job-reassessment-worker.test.ts tests/resume-intake-backend.test.ts tests/direct-idempotency.test.ts tests/durable-worker-lease.test.ts tests/untrusted-input.test.ts
      - name: Test queue transactions and permissions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f tests/criteria-queue.sql
      - name: Test immediate dispatch and scoped claims
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f tests/criteria-immediate.sql

      - name: Test durable reassessment queue and protected approval
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres reassessment
          psql -h localhost -U postgres -d reassessment -f tests/job-reassessments.sql

      - name: Test personal Home permissions
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres workspace_home_test
          psql -h localhost -U postgres -d workspace_home_test -f tests/workspace-home.sql

      - name: Test admin-only resources and downloads
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres admin_tools_test
          psql -h localhost -U postgres -d admin_tools_test -f tests/admin-tools.sql

      - name: Test durable intake, stale evidence, and document isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres core_intake
          psql -h localhost -U postgres -d core_intake -f tests/core-intake.sql

      - name: Test settings privacy, notifications, and account controls
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres personal_settings
          psql -h localhost -U postgres -d personal_settings -f tests/personal-settings.sql
      - name: Test confirmed usage counts and account isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres usage_analytics
          psql -h localhost -U postgres -d usage_analytics -f tests/usage-analytics.sql
          node tests/usage-migration-contention.mjs

      - name: Test learning capture, model gates, and workspace isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres feedback_learning
          psql -h localhost -U postgres -d feedback_learning -f tests/learning.sql

      - name: Test beta admission, quotas, revocation, and concurrent reservations
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres beta_security
          psql -h localhost -U postgres -d beta_security -f tests/beta-security.sql
          node tests/security-concurrency.mjs
          createdb -h localhost -U postgres resume_storage_budget
          psql -h localhost -U postgres -d resume_storage_budget -f tests/resume-storage-budget.sql
          createdb -h localhost -U postgres readiness_security
          psql -h localhost -U postgres -d readiness_security -f tests/readiness-security.sql

      - name: Test direct analysis claims, recovery and retention
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres direct_idempotency
          psql -h localhost -U postgres -d direct_idempotency -f tests/direct-idempotency.sql

      - name: Test shared assessment capacity across concurrent routes
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres assessment_capacity
          psql -h localhost -U postgres -d assessment_capacity -f tests/assessment-capacity.sql
          node tests/assessment-capacity-concurrency.mjs
          createdb -h localhost -U postgres durable_worker_recovery
          psql -h localhost -U postgres -d durable_worker_recovery -f tests/durable-worker-recovery.sql
          node tests/durable-worker-concurrency.mjs
